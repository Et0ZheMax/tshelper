name: Релизная сборка

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Проверить соответствие версии тегу
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from tshelper.version import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Версия v$version не совпадает с тегом ${{ github.ref_name }}" }
      - name: Собрать portable-архив
        shell: pwsh
        run: ./scripts/build_release.ps1
      - name: Опубликовать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*-portable.zip

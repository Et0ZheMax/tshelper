name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить пакет
        run: python -m pip install -e . --no-deps
      - name: Проверить синтаксис
        run: python -m compileall -q src tests
      - name: Запустить selftest
        run: python tests/selftest.py
      - name: Установить зависимости ADHelper 2
        run: python -m pip install -r apps/adhelper2/requirements.txt
      - name: Проверить ADHelper 2
        run: python apps/adhelper2/verify_project.py
      - name: Проверить релизную сборку
        shell: pwsh
        run: ./scripts/build_release.ps1
